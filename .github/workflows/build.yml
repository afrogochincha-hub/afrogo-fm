name: Build Afrogo FM

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

jobs:
  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check gateway syntax
        working-directory: backend
        run: node --check server.js

  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure public gateway URL
        working-directory: desktop
        shell: pwsh
        env:
          AFROGO_API_BASE_URL: ${{ vars.AFROGO_API_BASE_URL }}
        run: |
          $apiUrl = $env:AFROGO_API_BASE_URL
          if (-not $apiUrl) { $apiUrl = "https://afrogochincha.duckdns.org/afrogo-api" }
          if (-not $apiUrl.StartsWith("https://")) {
            throw "AFROGO_API_BASE_URL debe empezar por https://"
          }
          $config = @{ apiBaseUrl = $apiUrl } | ConvertTo-Json
          Set-Content -Path app-config.json -Value $config -Encoding utf8
      - name: Install and build desktop
        working-directory: desktop
        shell: pwsh
        run: |
          npm install
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: afrogo-fm-windows-portable
          path: desktop/dist/*.exe
          if-no-files-found: error

  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Assemble debug APK
        env:
          AFROGO_API_BASE_URL: ${{ vars.AFROGO_API_BASE_URL }}
        run: |
          if [[ -z "$AFROGO_API_BASE_URL" ]]; then
            AFROGO_API_BASE_URL="https://afrogochincha.duckdns.org/afrogo-api"
          fi
          if [[ ! "$AFROGO_API_BASE_URL" =~ ^https:// ]]; then
            echo "::error::AFROGO_API_BASE_URL debe empezar por https://"
            exit 1
          fi
          gradle --no-daemon -p android -PafrogoApiBaseUrl="$AFROGO_API_BASE_URL" assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: afrogo-fm-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
