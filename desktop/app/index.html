async function afrogoApi(path,options={}){if(!AFROGO_API_BASE)throw new Error('Falta configurar apiBaseUrl en desktop/app-config.json con la URL HTTPS del backend de Afrogo.');if(!/^https:\/\//i.test(AFROGO_API_BASE)&&!window.afrogo?.config?.allowInsecureHttp)throw new Error('El backend debe usar HTTPS. Solo en pruebas locales puedes activar AFROGO_ALLOW_INSECURE_HTTP=1.');const headers={...(options.headers||{})};if(options.body!==undefined)headers['Content-Type']='application/json';if(options.auth!==false&&remoteSessionToken&&!headers.Authorization)headers.Authorization='Bearer '+remoteSessionToken;const response=await fetch(AFROGO_API_BASE+path,{method:options.method||'GET',headers,body:options.body===undefined?undefined:JSON.stringify(options.body)});let data={};try{data=await response.json()}catch(_){}if(!response.ok)throw new Error(data.error||('Error del servidor ('+response.status+').'));return data;}
async function loadAzuraCatalog(showToast=false){if(remoteCatalogLoading||!remoteSessionToken)return;remoteCatalogLoading=true;try{const data=await afrogoApi('/api/catalog');const remote=(data.items||[]).map(t=>{const genreInfo=t.genreSource?{genre:t.genre||'Sin categoría',source:t.genreSource,confidence:Number(t.genreConfidence)||0}:window.AfrogoGenreClassifier.classifyGenre(t.genre,{title:t.title,artist:t.artist,album:t.album,path:t.path});return {id:'azura:'+String(t.id),remoteId:String(t.id),remoteAzura:true,source:'azuracast',title:t.title||'Canción sin título',artist:t.artist||'Artista desconocido',album:t.album||'',genre:genreInfo.genre||'Sin categoría',genreSource:genreInfo.source,genreConfidence:genreInfo.confidence,duration:Number(t.duration)||0,trackNumber:Number(t.trackNumber)||0,discNumber:Number(t.discNumber)||0,path:t.path||'',cover:t.coverUrl||'',url:t.playUrl||'',emoji:'♫',addedAt:'',sourceLabel:'AzuraCast'};});songs=[...songs.filter(s=>!s.remoteAzura),...remote];remoteCatalogLoaded=true;if(activeView)renderView(activeView);if(showToast){const counts={Urbano:0,Reguetón:0,Salsa:0,Cumbia:0,Baladas:0,Electrónica:0};remote.forEach(s=>{for(const g of Object.keys(counts)){if(window.AfrogoGenreClassifier.matchesCategory(s.genre,g,{title:s.title,artist:s.artist,album:s.album,path:s.path})){counts[g]++;break;}}});toast('Catálogo actualizado: '+remote.length+' canciones · '+Object.entries(counts).filter(([,n])=>n).map(([g,n])=>g+': '+n).join(' · '));}}catch(err){console.error('AzuraCast catálogo:',err);if(showToast||!remoteCatalogLoaded)toast('No se pudo cargar la biblioteca central: '+err.message);}finally{remoteCatalogLoading=false;}}

function localLibraryKey(kind){return user&&user.id?'afrogoUser:'+user.id+':'+kind:null;}
function readStoredArray(key){try{const value=JSON.parse(localStorage.getItem(key)||'[]');return Array.isArray(value)?value:[]}catch(_){return []}}

function enqueueCloudWrite(path,method,body){
  if(!cloudLibraryReady||!remoteSessionToken)return;
  const token=remoteSessionToken;
  cloudWriteChain=cloudWriteChain.then(()=>afrogoApi(path,{method,body,headers:{Authorization:'Bearer '+token}})).then(result=>{if(result&&result.updatedAt)cloudLastUpdatedAt=result.updatedAt;return result}).catch(err=>{
    console.error('Sincronización de biblioteca personal:',err);
    if(!cloudSyncErrorShown){cloudSyncErrorShown=true;toast('Cambios guardados en este equipo, pero falta sincronizar la nube. Comprueba tu conexión.');}
  });
}

async function loadCloudLibraryForUser(){
  if(!user||!remoteSessionToken)return;
  cloudLibraryReady=false;cloudSyncErrorShown=false;
  const scopedP=localLibraryKey('playlists'),scopedF=localLibraryKey('favorites'),scopedR=localLibraryKey('recentTracks');
  const legacyMigration=!localStorage.getItem('afrogoCloudSyncMigrationV1')&&user.role==='admin';
  const hasScopedP=!!scopedP&&localStorage.getItem(scopedP)!==null;
  const hasScopedF=!!scopedF&&localStorage.getItem(scopedF)!==null;
  const hasScopedR=!!scopedR&&localStorage.getItem(scopedR)!==null;
  let cloud=await afrogoApi('/api/me/library');
  // Legacy global lists migrate once for the administrator only. Never import them into a different user's new account.
  let localP=hasScopedP?readStoredArray(scopedP):(legacyMigration?readStoredArray('afrogoUserPlaylists'):[]);
  let localF=hasScopedF?readStoredArray(scopedF):(legacyMigration?readStoredArray('afrogoFavorites'):[]);
  let localR=hasScopedR?readStoredArray(scopedR):(legacyMigration?readStoredArray('afrogoListeningHistory'):[]);
  let next={playlists:Array.isArray(cloud.playlists)?cloud.playlists:[],favorites:Array.isArray(cloud.favorites)?cloud.favorites:[],savedTracks:Array.isArray(cloud.savedTracks)?cloud.savedTracks:[],recentTracks:Array.isArray(cloud.recentTracks)?cloud.recentTracks:[]};
  const hasLegacyData=localP.length||localF.length||localR.length;
  if(!cloud.initialized){
    next={playlists:localP,favorites:localF.map(String),savedTracks:localF.map(String),recentTracks:localR};
    cloud=await afrogoApi('/api/me/library',{method:'PUT',body:next});
    next={playlists:cloud.playlists||[],favorites:cloud.favorites||[],savedTracks:cloud.savedTracks||[],recentTracks:cloud.recentTracks||[]};
  }else if(legacyMigration&&hasLegacyData){
    const byId=new Map((next.playlists||[]).map(p=>[String(p.id),p]));
    for(const p of localP){if(p&&p.id&&!byId.has(String(p.id)))byId.set(String(p.id),p)}
    next.playlists=[...byId.values()].slice(0,200);
    next.favorites=[...new Set([...(next.favorites||[]).map(String),...localF.map(String)])].slice(0,5000);
    next.savedTracks=[...new Set([...(next.savedTracks||[]).map(String),...localF.map(String)])].slice(0,5000);
    const recentByKey=new Map([...(next.recentTracks||[]),...localR].map(h=>[String(h.id)+'|'+String(h.playedAt),h]));
    next.recentTracks=[...recentByKey.values()].sort((a,b)=>Number(b.playedAt||0)-Number(a.playedAt||0)).slice(0,300);
    cloud=await afrogoApi('/api/me/library',{method:'PUT',body:next});
    next={playlists:cloud.playlists||[],favorites:cloud.favorites||[],savedTracks:cloud.savedTracks||[],recentTracks:cloud.recentTracks||[]};
  }
  userPlaylists=Array.isArray(next.playlists)?next.playlists:[];
  cloudLastUpdatedAt=cloud.updatedAt||null;
  favorites=new Set((Array.isArray(next.favorites)?next.favorites:[]).map(String));
  listeningHistory=Array.isArray(next.recentTracks)?next.recentTracks:[];
  savePersonalStateLocal();
  if(legacyMigration){localStorage.removeItem('afrogoUserPlaylists');localStorage.removeItem('afrogoFavorites');localStorage.removeItem('afrogoListeningHistory');localStorage.setItem('afrogoCloudSyncMigrationV1','1');}
  cloudLibraryReady=true;
}
async function refreshCloudLibraryFromServer(){
  if(!cloudLibraryReady||!remoteSessionToken||cloudRefreshInProgress||document.hidden||document.getElementById('playlistEditBackdrop'))return;
  cloudRefreshInProgress=true;
  try{
    await cloudWriteChain;
    const remote=await afrogoApi('/api/me/library');
    if(remote.updatedAt&&remote.updatedAt!==cloudLastUpdatedAt){
      userPlaylists=Array.isArray(remote.playlists)?remote.playlists:[];
      favorites=new Set((Array.isArray(remote.favorites)?remote.favorites:[]).map(String));
      listeningHistory=Array.isArray(remote.recentTracks)?remote.recentTracks:[];
      cloudLastUpdatedAt=remote.updatedAt;
      savePersonalStateLocal();
      if(['playlists','playlistDetail','favorites','recents'].includes(activeView))renderView(activeView==='playlistDetail'?'playlists':activeView);
      syncFavoriteButton();
    }
  }catch(err){console.warn('No se pudo actualizar la biblioteca desde otro dispositivo:',err.message)}
  finally{cloudRefreshInProgress=false}
}

   e.preventDefault();const email=$('email').value.trim().toLowerCase(),password=$('password').value,name=$('displayName').value.trim()||email.split('@')[0];

// Reconoce portadas iguales visualmente (no solo URLs). Esto permite reunir
// canciones que llegaron con nombres de álbum inconsistentes desde AzuraCast.
const albumCoverHashCache=new Map();
const albumCoverHashFailures=new Set();
let albumCoverFingerprintPromise=null;
let albumCoverFingerprintProgress={done:0,total:0};
function computeAlbumCoverHash(url){
 return new Promise(resolve=>{
  if(!url)return resolve('');
  let settled=false;
  const finish=value=>{if(settled)return;settled=true;clearTimeout(timer);resolve(value||'')};
  const img=new Image();
  const timer=setTimeout(()=>{img.onload=null;img.onerror=null;finish('')},4500);
  if(/^https?:/i.test(url))img.crossOrigin='anonymous';
  img.onload=()=>{
   try{
    const size=16,canvas=document.createElement('canvas');canvas.width=size;canvas.height=size;
    const ctx=canvas.getContext('2d',{willReadFrequently:true});if(!ctx) return finish('');
    // Compara la zona cuadrada central, tal como se ve en la portada del álbum.
    const w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
    if(!w||!h)return finish('');
    const side=Math.min(w,h),sx=(w-side)/2,sy=(h-side)/2;
    ctx.drawImage(img,sx,sy,side,side,0,0,size,size);
    const px=ctx.getImageData(0,0,size,size).data,luma=[];let total=0,red=0,green=0,blue=0;
    for(let i=0;i<px.length;i+=4){const r=px[i],g=px[i+1],b=px[i+2],v=Math.round(r*.299+g*.587+b*.114);luma.push(v);total+=v;red+=r;green+=g;blue+=b;}
    const avg=total/luma.length;
    // Incluye color promedio para que portadas lisas de colores diferentes no
    // se confundan solo porque tengan un patrón de brillo parecido.
    const color=[red/size**2,green/size**2,blue/size**2].map(v=>Math.max(0,Math.min(7,Math.round(v/32)))).join('');
    finish(color+':'+luma.map(v=>v>=avg?'1':'0').join(''));
   }catch(err){
    // Puede fallar si el servidor de imágenes no permite lectura CORS; en ese
    // caso seguimos agrupando por metadatos y por URL exactamente igual.
    finish('');
   }
  };
  img.onerror=()=>finish('');
  img.src=url;
 });
}
function hammingDistance(a,b){
 if(!a||!b)return Infinity;const ai=String(a).indexOf(':'),bi=String(b).indexOf(':');
 if(ai<0||bi<0)return Infinity;const ac=String(a).slice(0,ai),bc=String(b).slice(0,bi),ab=String(a).slice(ai+1),bb=String(b).slice(bi+1);
 if(ab.length!==bb.length||ac.length!==3||bc.length!==3)return Infinity;
 for(let i=0;i<3;i++)if(Math.abs(Number(ac[i])-Number(bc[i]))>1)return Infinity;
 let distance=0;for(let i=0;i<ab.length;i++)if(ab[i]!==bb[i]&&++distance>12)return distance;return distance;
}
async function prepareAlbumCoverFingerprints(){
 if(albumCoverFingerprintPromise)return albumCoverFingerprintPromise;
 const urls=[...new Set(songs.map(s=>String(s&&s.cover||'').trim()).filter(Boolean))].filter(url=>!albumCoverHashCache.has(url)&&!albumCoverHashFailures.has(url));
 if(!urls.length){for(const s of songs)if(s&&s.cover)s.coverFingerprint=albumCoverHashCache.get(String(s.cover))||'';return;}
 albumCoverFingerprintPromise=(async()=>{
  albumCoverFingerprintProgress={done:0,total:urls.length};let next=0;
  const workers=Array.from({length:Math.min(6,urls.length)},async()=>{
   while(next<urls.length){const url=urls[next++];const hash=await computeAlbumCoverHash(url);if(hash)albumCoverHashCache.set(url,hash);else albumCoverHashFailures.add(url);albumCoverFingerprintProgress.done++;}
  });
  await Promise.all(workers);
  for(const s of songs)if(s&&s.cover)s.coverFingerprint=albumCoverHashCache.get(String(s.cover))||'';
 })().finally(()=>{albumCoverFingerprintPromise=null});
 return albumCoverFingerprintPromise;
}
function getAlbumGroups(){
 const candidates=songs.filter(s=>s&&!s.categoryShortcut&&s.url);
 const invalidAlbums=new Set(['','biblioteca afrogo','subido por administracion','sin album','unknown album','unknown','album desconocido']);
 const validAlbum=s=>{const k=albumNormalize(s.album);return !!k&&!invalidAlbums.has(k)};
 const parent=candidates.map((_,i)=>i);
 const root=i=>{while(parent[i]!==i){parent[i]=parent[parent[i]];i=parent[i]}return i};
 const unite=(a,b)=>{a=root(a);b=root(b);if(a!==b)parent[b]=a};
 const metadataBuckets=new Map(),coverUrlBuckets=new Map();
 const coverRepresentatives=[];
 // Agrupa primero por los metadatos habituales artista + álbum.
 candidates.forEach((s,i)=>{
  const artistKey=albumNormalize(s.artist),albumKey=albumNormalize(s.album);
  if(artistKey&&artistKey!=='artista desconocido'&&validAlbum(s)){
   const k=artistKey+'::'+albumKey;if(metadataBuckets.has(k))unite(i,metadataBuckets.get(k));else metadataBuckets.set(k,i);
  }
  const cover=String(s.cover||'').trim();
  if(cover){
   // Respaldo seguro cuando no se puede leer la imagen para calcular su huella.
   const normalizedUrl=cover.split('#')[0];
   if(coverUrlBuckets.has(normalizedUrl))unite(i,coverUrlBuckets.get(normalizedUrl));else coverUrlBuckets.set(normalizedUrl,i);
   const hash=s.coverFingerprint||albumCoverHashCache.get(cover)||'';
   if(hash){
    let match=null;
    for(const rep of coverRepresentatives){if(hammingDistance(hash,rep.hash)<=12){match=rep;break;}}
    if(match)unite(i,match.index);else coverRepresentatives.push({hash,index:i});
   }
  }
 });
 const components=new Map();
 candidates.forEach((s,i)=>{const r=root(i);if(!components.has(r))components.set(r,[]);components.get(r).push(s)});
 const modeEntry=(tracks,selector,accept=()=>true)=>{
  const counts=new Map();
  for(const s of tracks){if(!accept(s))continue;const label=String(selector(s)||'').trim();if(!label)continue;const key=albumNormalize(label);if(!key)continue;const item=counts.get(key)||{label,count:0};item.count++;counts.set(key,item);}
  return [...counts.values()].sort((a,b)=>b.count-a.count||a.label.length-b.label.length)[0]?.label||'';
 };
 const groups=[];
 for(const tracks of components.values()){
  const realAlbum=modeEntry(tracks,s=>s.album,s=>validAlbum(s));
  const album=realAlbum||'Álbum sin título';
  const albumKey=albumNormalize(album);
  const artists=[...new Set(tracks.map(s=>String(s.artist||'').trim()).filter(a=>a&&albumNormalize(a)!=='artista desconocido'))];
  const artist=modeEntry(tracks,s=>s.artist,s=>!!s.artist&&albumNormalize(s.artist)!=='artista desconocido')||'Varios artistas';
  const artistKey=albumNormalize(artist);
  const fingerprintCounts=new Map();
  for(const s of tracks){const hash=s.coverFingerprint||albumCoverHashCache.get(String(s.cover||''))||'';if(hash)fingerprintCounts.set(hash,(fingerprintCounts.get(hash)||0)+1);}
  const dominantHash=[...fingerprintCounts.entries()].sort((a,b)=>b[1]-a[1])[0]?.[0]||'';
  const coverTrack=(dominantHash&&tracks.find(s=>(s.coverFingerprint||albumCoverHashCache.get(String(s.cover||''))||'')===dominantHash))||tracks.find(s=>s.cover);
  const metadataIdentityCounts=new Map();
  for(const s of tracks){const ak=albumNormalize(s.artist),bk=albumNormalize(s.album);if(ak&&ak!=='artista desconocido'&&bk&&!invalidAlbums.has(bk)){const key=ak+'::'+bk;metadataIdentityCounts.set(key,(metadataIdentityCounts.get(key)||0)+1);}}
  const dominantMetadata=[...metadataIdentityCounts.entries()].sort((a,b)=>b[1]-a[1])[0]?.[0];
  const key=dominantMetadata|| (dominantHash?'cover:'+dominantHash:'track:'+String(tracks[0].id));
  const sortedTracks=tracks.slice().sort((a,b)=>{
   const ad=Number(a.discNumber||0),bd=Number(b.discNumber||0);if(ad&&bd&&ad!==bd)return ad-bd;
   const an=Number(a.trackNumber||a.trackNo||0),bn=Number(b.trackNumber||b.trackNo||0);if(an&&bn&&an!==bn)return an-bn;
   if(an&&!bn)return -1;if(bn&&!an)return 1;return String(a.title||'').localeCompare(String(b.title||''),'es');
  });
  groups.push({key,artist,artistKey,album,albumKey,tracks:sortedTracks,cover:coverTrack&&coverTrack.cover||'',duration:sortedTracks.reduce((sum,s)=>sum+(Number(s.duration)||0),0),playable:sortedTracks.filter(s=>s.url),visualGrouping:!!dominantHash,sourceArtistCount:artists.length});
 }
 return groups.sort((a,b)=>a.artist.localeCompare(b.artist,'es')||a.album.localeCompare(b.album,'es'));
}

async function scanExistingAlbumMetadata(){

function syncFavoriteButton(){const b=$('favoriteCurrent');const on=!!(currentId&&favorites.has(currentId));b.textContent=on?'♥':'♡';b.classList.toggle('is-favorite',on);b.setAttribute('aria-pressed',String(on));const add=$('addCurrentToPlaylist');if(add){add.disabled=!currentId;add.title=currentId?'Añadir canción a una playlist':'Primero elige una canción';}}
function updateMarquee(){const el=$('playerTitle'), viewport=el.parentElement;el.classList.remove('scrolling-title');el.style.removeProperty('--marquee-distance');requestAnimationFrame(()=>{const overflow=el.scrollWidth-viewport.clientWidth;if(overflow>8){el.style.setProperty('--marquee-distance',`-${overflow}px`);el.classList.add('scrolling-title')}})}
function playSong(id,preserveQueue=false){const s=songs.find(x=>x.id===id);if(!s)return;if(s.categoryShortcut){activateCategoryShortcut(id,true);return}const liveRadio=$('afrogoRadioStream');if(liveRadio&&!liveRadio.paused)liveRadio.pause();if(!preserveQueue)activeQueueIds=[];playCounts[id]=(playCounts[id]||0)+1;if(s.url&&!privateSession){listeningHistory.unshift({id:s.id,title:s.title,artist:s.artist||'Artista desconocido',album:s.album||'',genre:s.genre||'',cover:s.cover||'',playedAt:Date.now()});listeningHistory=listeningHistory.slice(0,300);try{localStorage.setItem(user&&user.id?localLibraryKey('recentTracks'):'afrogoListeningHistory',JSON.stringify(listeningHistory))}catch(e){}syncRecentToCloud({id:s.id,title:s.title,artist:s.artist||'Artista desconocido',album:s.album||'',genre:s.genre||'',cover:s.cover||'',playedAt:Date.now()})}currentId=id;audio.pause();audio.removeAttribute('src');audio.load();$('playerTitle').textContent=s.title;$('playerArtist').textContent=s.artist;setPlayerCover(s);syncFavoriteButton();$('seekControl').value='0';$('elapsed').textContent='0:00';$('duration').textContent=fmt(s.duration||0);updateMarquee();if(!s.url){$('playPause').textContent='▶';toast('Este elemento no contiene audio propio. Selecciona una canción de la biblioteca para reproducirla.');return}audio.src=s.url;audio.volume=Number($('volumeControl').value)/100;audio.load();audio.play().then(()=>{$('playPause').textContent='Ⅱ'}).catch(err=>{console.error(err);toast('No se pudo reproducir este archivo. Prueba otro formato de audio.')})}
function toggleFavorite(id){const active=!favorites.has(String(id));if(active)favorites.add(String(id));else favorites.delete(String(id));try{if(user&&user.id)localStorage.setItem(localLibraryKey('favorites'),JSON.stringify([...favorites]));else localStorage.setItem('afrogoFavorites',JSON.stringify([...favorites]))}catch(_){}setCloudFavorite(id,active);renderView(activeView);syncFavoriteButton()}
$('favoriteCurrent').onclick=()=>{if(currentId)toggleFavorite(currentId);else toast('Primero elige una canción.')};
$('addCurrentToPlaylist').onclick=()=>{if(currentId)addSongToPlaylist(currentId);else toast('Primero elige una canción.');};
$('playPause').onclick=()=>{if(audio.paused){if(audio.src)audio.play().then(()=>$('playPause').textContent='Ⅱ');else if(currentId)playSong(currentId);else toast('Elige una canción de la biblioteca.')}else{audio.pause();$('playPause').textContent='▶'}};
$('prev').onclick=()=>moveSong(-1);$('next').onclick=()=>moveSong(1);
function moveSong(direction){const queued=activeQueueIds.map(id=>songs.find(s=>String(s.id)===String(id))).filter(s=>s&&s.url&&!s.categoryShortcut);const playable=queued.length?queued:songs.filter(s=>s.url&&!s.categoryShortcut);if(!playable.length){toast('No hay canciones subidas con audio para cambiar.');return}let i=playable.findIndex(s=>String(s.id)===String(currentId));if(i<0){playSong(playable[direction>0?0:playable.length-1].id,queued.length>0);return}if(shuffleEnabled&&playable.length>1){let next=i;while(next===i)next=Math.floor(Math.random()*playable.length);playSong(playable[next].id,queued.length>0);return}let next=i+direction;if(next<0)next=playable.length-1;if(next>=playable.length)next=0;playSong(playable[next].id,queued.length>0)}
$('shuffle').onclick=()=>{shuffleEnabled=!shuffleEnabled;$('shuffle').classList.toggle('active',shuffleEnabled);$('shuffle').setAttribute('aria-pressed',String(shuffleEnabled));toast(shuffleEnabled?'Reproducción aleatoria activada.':'Reproducción aleatoria desactivada.')};
$('repeat').onclick=()=>{repeatMode=repeatMode===0?1:0;$('repeat').classList.toggle('active',repeatMode===1);$('repeat').textContent=repeatMode===1?'↻¹':'↻';$('repeat').title=repeatMode===1?'Repetir canción actual: activado':'Repetir canción actual: desactivado';$('repeat').setAttribute('aria-label',$('repeat').title);toast(repeatMode===1?'Se repetirá la canción actual.':'Repetición desactivada; al terminar pasará a la siguiente canción.')};
let seeking=false;const seek=$('seekControl');let seekTarget=null;
seek.addEventListener('pointerdown',()=>{seeking=true;seekTarget=Number(seek.value)});
seek.addEventListener('input',()=>{seeking=true;seekTarget=Number(seek.value);const d=audio.duration;if(Number.isFinite(d)&&d>0){$('elapsed').textContent=fmt(d*seekTarget/1000)}});
seek.addEventListener('pointerup',()=>{applySeek()});seek.addEventListener('change',()=>{applySeek()});
seek.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Home','End','PageUp','PageDown'].includes(e.key)){seeking=true;setTimeout(applySeek,0)}});
function applySeek(){const d=audio.duration;const target=seekTarget===null?Number(seek.value):seekTarget;if(Number.isFinite(d)&&d>0&&audio.src){const wasPlaying=!audio.paused;const newTime=Math.max(0,Math.min(d,d*target/1000));try{audio.currentTime=newTime;}catch(e){console.error('Seek failed',e);toast('Este archivo no permite cambiar la posición. Prueba convertirlo a MP3.');}if(wasPlaying&&audio.paused)audio.play().catch(()=>{});seeking=false;seekTarget=null;}else{seeking=false;seekTarget=null;toast('Espera a que el audio cargue para adelantarlo.')}}
audio.addEventListener('timeupdate',()=>{const t=audio.currentTime||0,d=audio.duration||0;$('elapsed').textContent=fmt(t);$('duration').textContent=fmt(d);if(d&&!seeking&&document.activeElement!==seek)seek.value=String(Math.round(t/d*1000))});
audio.addEventListener('loadedmetadata',()=>{$('duration').textContent=fmt(audio.duration||0);if(!seeking)seek.value=String(Math.round(((audio.currentTime||0)/(audio.duration||1))*1000))});
audio.addEventListener('play',()=>{$('playPause').textContent='Ⅱ'});audio.addEventListener('pause',()=>{$('playPause').textContent='▶'});
audio.addEventListener('ended',()=>{if(repeatMode===1){audio.currentTime=0;audio.play().catch(()=>{});return}moveSong(1)});function fmt(n){return Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0')}
const volumeControl=$('volumeControl');audio.volume=0.7;volumeControl.addEventListener('input',()=>{audio.volume=Number(volumeControl.value)/100;$('volumeValue').textContent=volumeControl.value+'%';});
let editCoverData='';
function editTrack(id){const s=songs.find(x=>x.id===id);if(!s)return;editCoverData=s.cover||'';$('editModalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeEditTrack()"><section class="edit-modal"><h2>Editar canción</h2><p class="muted">Corrige manualmente los metadatos y la portada que verá toda la biblioteca de esta instalación.</p><form id="editTrackForm"><div style="display:flex;align-items:center;gap:14px;margin:15px 0"><img id="editCoverPreview" class="edit-cover-preview" src="${esc(editCoverData||'')}" onerror="this.removeAttribute('src')" alt="Vista previa"/><label class="upload-label">Elegir portada<input id="editCoverFile" type="file" accept="image/*" style="display:none"></label><button type="button" class="subtle" onclick="clearEditCover()">Quitar portada</button></div><div class="edit-grid"><label class="edit-field">Título<input id="editTitle" required value="${esc(s.title)}"></label><label class="edit-field">Artista<input id="editArtist" value="${esc(s.artist)}"></label><label class="edit-field">Álbum<input id="editAlbum" value="${esc(s.album)}"></label><label class="edit-field">Género<input id="editGenre" value="${esc(s.genre)}"></label></div><div class="modal-actions"><button type="button" class="subtle" onclick="closeEditTrack()">Cancelar</button><button type="submit" class="primary">Guardar cambios</button></div></form></section></div>`;
$('editCoverFile').addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;if(!f.type.startsWith('image/')){toast('Selecciona un archivo de imagen.');return}editCoverData=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result));r.onerror=reject;r.readAsDataURL(f)});$('editCoverPreview').src=editCoverData});
$('editTrackForm').addEventListener('submit',async e=>{e.preventDefault();const updates={title:$('editTitle').value.trim(),artist:$('editArtist').value.trim()||'Artista desconocido',album:$('editAlbum').value.trim()||'Biblioteca Afrogo',genre:$('editGenre').value.trim()||'Sin categoría',cover:editCoverData};try{if(window.afrogo&&window.afrogo.updateTrack){const saved=await window.afrogo.updateTrack({id,updates});songs=songs.map(x=>x.id===id?saved:x)}else{Object.assign(s,updates)}if(currentId===id){$('playerTitle').textContent=songs.find(x=>x.id===id).title;$('playerArtist').textContent=songs.find(x=>x.id===id).artist;setPlayerCover(songs.find(x=>x.id===id));updateMarquee();renderKaraoke()}closeEditTrack();renderView(activeView);toast('Datos y portada guardados.')}catch(err){console.error(err);toast('No se pudieron guardar los cambios.')}});
}
function clearEditCover(){editCoverData='';const img=$('editCoverPreview');if(img)img.removeAttribute('src')}
function closeEditTrack(){$('editModalRoot').innerHTML=''}
window.editTrack=editTrack;window.closeEditTrack=closeEditTrack;window.clearEditCover=clearEditCover;
async function deleteMusicTrack(id){
 if(!user||user.role!=='admin')return toast('Solo el administrador puede eliminar música.');
 const song=songs.find(x=>x.id===id);if(!song||song.categoryShortcut)return toast('Esta opción no es una canción de la biblioteca.');
 if(!confirm('¿Eliminar definitivamente «'+song.title+'» de la biblioteca de Afrogo FM? Esta acción no se puede deshacer.'))return;
 try{
  if(window.afrogo&&window.afrogo.deleteTrack)await window.afrogo.deleteTrack(id);
  else if(song.url&&song.url.startsWith('blob:'))URL.revokeObjectURL(song.url);
  songs=songs.filter(x=>x.id!==id);favorites.delete(id);
  userPlaylists=userPlaylists.map(p=>({...p,songIds:(p.songIds||[]).filter(songId=>songId!==id)}));saveUserPlaylists();userPlaylists.forEach(syncPlaylistToCloud);
  listeningHistory=listeningHistory.filter(item=>item.id!==id);try{localStorage.setItem('afrogoListeningHistory',JSON.stringify(listeningHistory));}catch(e){}
  delete playCounts[id];
  if(currentId===id){audio.pause();audio.removeAttribute('src');audio.load();currentId=null;$('playerTitle').textContent='Selecciona una canción';$('playerArtist').textContent='Afrogo FM';setPlayerCover(null);$('elapsed').textContent='0:00';$('duration').textContent='0:00';$('seekControl').value='0';$('playPause').textContent='▶';syncFavoriteButton();updateMarquee();}
  renderView(activeView==='admin'?'admin':activeView);toast('Canción eliminada de la biblioteca.');
 }catch(err){console.error(err);toast('No se pudo eliminar la canción. Inténtalo de nuevo.');}
}
window.deleteMusicTrack=deleteMusicTrack;
async function handleUploads(files){
 if(!user||user.role!=='admin')return toast('Solo el administrador puede subir música.');
 if(!remoteSessionToken)return toast('Inicia sesión con la cuenta administradora del servidor central.');
 const selected=Array.from(files||[]);if(!selected.length)return;
 let added=0,duplicates=0,failed=0,processed=0;
 const progress=$('uploadProgress');if(progress){progress.style.display='block';progress.textContent='Preparando '+selected.length+' archivo(s)…';}
 const valid=selected.filter(f=>f.type.startsWith('audio/')||/\.(mp3|m4a|ogg|wav|flac|aac|opus)$/i.test(f.name));
 const norm=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\.[a-z0-9]{2,5}$/i,'').replace(/[^a-z0-9]+/g,' ').trim();
 const known=new Set(songs.filter(s=>s.remoteAzura).flatMap(s=>[norm(s.path),norm(s.title),norm((s.artist||'')+' '+(s.title||''))]).filter(Boolean));
 for(const f of valid){
  try{
   const fileNorm=norm(f.name);
   if(known.has(fileNorm)){duplicates++;processed++;if(progress)progress.textContent='Procesadas '+processed+' de '+valid.length+' · '+f.name+' omitida: posible duplicado';continue;}
   const form=new FormData();const flowId=norm(f.name).replace(/\s+/g,'-')+'-'+f.size+'-'+Date.now().toString(36);form.append('path',f.name);form.append('currentDirectory','');form.append('flowTotalChunks','1');form.append('flowChunkNumber','1');form.append('flowCurrentChunkSize',String(f.size));form.append('flowTotalSize',String(f.size));form.append('flowIdentifier',flowId);form.append('flowFilename',f.name);form.append('file',f,f.name);
   const response=await fetch(AFROGO_API_BASE+'/api/admin/tracks/upload',{method:'POST',headers:{Authorization:'Bearer '+remoteSessionToken},body:form});
   let result={};try{result=await response.json()}catch(_){}
   if(!response.ok)throw new Error(result.error||('Error subiendo '+f.name+' ('+response.status+')'));
   added++;known.add(fileNorm);
  }catch(err){console.error(err);failed++;}
  processed++;if(progress)progress.textContent='Procesadas '+processed+' de '+valid.length+' · Subidas '+added+' · Duplicadas omitidas '+duplicates+' · Errores '+failed;
 }
 await loadAzuraCatalog(false);renderView('admin');
 if(progress){progress.style.display='none';progress.textContent='';}
 toast('Carga central finalizada: '+added+' subidas a AzuraCast, '+duplicates+' posibles duplicados omitidos'+(failed?', '+failed+' errores':'')+'.');
 const input=$('audioFiles');if(input)input.value='';
}
</script></body></html>
